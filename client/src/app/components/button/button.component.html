<button (click)="clickHandler()" type="submit" [disabled]="isDisabled() || isLoading()" class="w-full flex justify-center bg-blue-900 text-white rounded-md p-2 
           cursor-pointer hover:bg-blue-800 
           disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-blue-900">
    @if(isLoading()){
    <div class="w-4 h-4 border-2 mr-2 border-white border-t-transparent rounded-full animate-spin">

    </div>
    }
    @if(isLoading()){
    <span>
        Processing...
    </span>
    }@else{
    <span>
        {{text()}}
    </span>
    }
</button>
